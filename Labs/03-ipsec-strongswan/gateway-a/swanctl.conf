connections {
    site-a-to-b {
        version = 2
        local_addrs = 172.16.0.10
        remote_addrs = 172.16.0.20
        proposals = aes256gcm16-prfsha256-ecp256

        local {
            auth = psk
            id = gateway-a.uit.lab
        }
        remote {
            auth = psk
            id = gateway-b.uit.lab
        }
        children {
            net-a-to-b {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16-ecp256
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    ike-site-ab {
        id-a = gateway-a.uit.lab
        id-b = gateway-b.uit.lab
        secret = "UIT_NT140_IPsec_Strong_PreShared_Key_2026!"
    }
}
