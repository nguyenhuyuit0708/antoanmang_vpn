# OpenVPN Server - Remote-Access (SSL/TLS + PKI)
port 1194
proto udp
dev tun

ca /etc/openvpn/lab/keys/ca.crt
cert /etc/openvpn/lab/keys/server.crt
key /etc/openvpn/lab/keys/server.key
dh /etc/openvpn/lab/keys/dh.pem
tls-auth /etc/openvpn/lab/keys/ta.key 0

# Mang ao cap cho cac VPN Client
server 10.8.0.0 255.255.255.0
topology subnet

# Day route mang noi bo cong ty (192.168.70.0/24) ve cho Client
push "route 192.168.70.0 255.255.255.0"

# Ma hoa hien dai AEAD (AES-256-GCM)
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256
tls-version-min 1.2

keepalive 10 120
persist-key
persist-tun
status /var/log/openvpn-status.log
verb 3
