# OpenVPN Site-to-Site: Site A (LAN 192.168.10.0/24 <-> Site B LAN 192.168.20.0/24)
# Khoi tao khoa tinh truoc: openvpn --genkey secret static.key
dev tun
proto udp
port 1195
ifconfig 10.8.1.1 10.8.1.2
secret static.key
route 192.168.20.0 255.255.255.0
cipher AES-256-CBC
auth SHA256
keepalive 10 60
persist-key
persist-tun
verb 3
