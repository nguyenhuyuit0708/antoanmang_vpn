services:
  vpn-client:
    build: .
    container_name: seed-vpn-client
    hostname: vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      net-public:
        ipv4_address: 10.9.0.5
    command: tail -f /dev/null

  vpn-server:
    build: .
    container_name: seed-vpn-server
    hostname: vpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-public:
        ipv4_address: 10.9.0.11
      net-private:
        ipv4_address: 192.168.60.11
    command: tail -f /dev/null

  host-internal:
    build: .
    container_name: seed-host-internal
    hostname: host-internal
    cap_add:
      - NET_ADMIN
    networks:
      net-private:
        ipv4_address: 192.168.60.5
    command: >
      sh -c "ip route replace 192.168.53.0/24 via 192.168.60.11 && tail -f /dev/null"

networks:
  net-public:
    driver: bridge
    ipam:
      config:
        - subnet: 10.9.0.0/24
  net-private:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.60.0/24
